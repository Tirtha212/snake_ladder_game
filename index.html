<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake &amp; Ladder</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app">
    <div class="panel">
      <h1>Snake &amp; Ladder</h1>

      <div class="status">
        <p class="turn" id="turn">Turn: Red</p>
        <div class="dice-box">
          <span>Dice</span>
          <div class="dice" id="dice">-</div>
        </div>
      </div>

      <div class="actions">
        <button class="primary-btn" id="rollBtn">Roll Dice</button>
        <button class="secondary-btn" id="newGameBtn">New Game</button>
      </div>

      <p class="message" id="message">Red starts the game.</p>

      <div class="legend">
        <span class="legend-item"><span class="legend-dot" style="background:#ef4444;"></span> Snake</span>
        <span class="legend-item"><span class="legend-dot" style="background:#22c55e;"></span> Ladder</span>
      </div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>
  </div>

  <script src="./script.js" defer></script>
</body>
</html>

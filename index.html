<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake & Ladder</title>
  <style>
    :root {
      --bg: #f5f7ff;
      --panel: #ffffff;
      --primary: #3d5af1;
      --secondary: #eef2ff;
      --text: #1f2937;
      --muted: #6b7280;
      --snake: #ef4444;
      --ladder: #22c55e;
      --board-line: #dfe7ff;
      --shadow: 0 16px 40px rgba(35, 54, 110, 0.15);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #edf3ff, #f9fbff);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
      width: min(1100px, 100%);
      background: rgba(255,255,255,0.6);
      border: 1px solid rgba(122,138,255,0.15);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 24px;
      backdrop-filter: blur(10px);
    }

    .panel {
      background: var(--panel);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid #ecf0ff;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: 0.5px;
      color: var(--primary);
    }

    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--secondary);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .turn {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0;
    }

    .dice-box {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
    }

    .dice {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: #fff;
      border: 2px solid #dfe7ff;
      display: grid;
      place-items: center;
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--primary);
      box-shadow: inset 0 0 0 1px rgba(61, 90, 241, 0.04);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .primary-btn {
      background: var(--primary);
      color: white;
      flex: 1;
    }

    .secondary-btn {
      background: #edf1ff;
      color: var(--primary);
      flex: 1;
    }

    .message {
      margin: 0;
      min-height: 48px;
      background: #f8fafc;
      border-radius: 12px;
      padding: 12px 14px;
      line-height: 1.5;
      color: var(--muted);
      border: 1px solid #edf1ff;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 6px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .legend-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
    }

    .board-wrap {
      background: var(--panel);
      border-radius: 24px;
      border: 1px solid #edf1ff;
      padding: 18px;
      min-width: 0;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 6px;
      background: #edf2ff;
      padding: 10px;
      border-radius: 20px;
      aspect-ratio: 1 / 1;
    }

    .cell {
      position: relative;
      background: linear-gradient(135deg, #ffffff, #f7f9ff);
      border: 1px solid var(--board-line);
      border-radius: 10px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 6px;
      min-height: 0;
      overflow: hidden;
    }

    .cell-number {
      font-size: 0.7rem;
      font-weight: 700;
      color: #475569;
      z-index: 1;
    }

    .cell.snake-cell {
      background: linear-gradient(135deg, #fff0f0, #ffe3e3);
      border-color: #fbcaca;
    }

    .cell.ladder-cell {
      background: linear-gradient(135deg, #effff5, #ddfbe5);
      border-color: #bfeecb;
    }

    .token {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.9);
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      right: 6px;
      bottom: 6px;
      z-index: 2;
    }

    .token:nth-child(2) { right: 28px; bottom: 6px; }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .panel { padding: 16px; }
      .status { flex-direction: column; align-items: flex-start; }
      .actions { flex-direction: column; }
      .primary-btn, .secondary-btn { width: 100%; }
      .board { gap: 4px; padding: 8px; }
      .cell-number { font-size: 0.58rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="panel">
      <h1>Snake & Ladder</h1>

      <div class="status">
        <p class="turn" id="turn">Turn: Red</p>
        <div class="dice-box">
          <span>Dice</span>
          <div class="dice" id="dice">-</div>
        </div>
      </div>

      <div class="actions">
        <button class="primary-btn" id="rollBtn">Roll Dice</button>
        <button class="secondary-btn" id="newGameBtn">New Game</button>
      </div>

      <p class="message" id="message">Red starts the game.</p>

      <div class="legend">
        <span class="legend-item"><span class="legend-dot" style="background:#ef4444;"></span> Snake</span>
        <span class="legend-item"><span class="legend-dot" style="background:#22c55e;"></span> Ladder</span>
      </div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>
  </div>

  <script>
    const snakes = {
      16: 6,
      47: 26,
      49: 11,
      56: 53,
      62: 19,
      64: 60,
      87: 24,
      93: 73,
      95: 75,
      98: 78
    };

    const ladders = {
      1: 38,
      4: 14,
      9: 31,
      21: 42,
      28: 84,
      36: 44,
      51: 67,
      71: 91,
      80: 100
    };

    const players = [
      { name: "Red", color: "#ff5a5a", position: 0 },
      { name: "Blue", color: "#4da3ff", position: 0 },
      { name: "Green", color: "#41d67a", position: 0 },
      { name: "Yellow", color: "#f9d85c", position: 0 }
    ];

    let currentPlayerIndex = 0;
    let gameOver = false;

    const boardEl = document.getElementById("board");
    const turnEl = document.getElementById("turn");
    const diceEl = document.getElementById("dice");
    const messageEl = document.getElementById("message");
    const rollBtn = document.getElementById("rollBtn");
    const newGameBtn = document.getElementById("newGameBtn");

    function buildBoard() {
      const rows = [];
      for (let row = 9; row >= 0; row--) {
        const values = [];
        const start = row * 10 + 1;
        const end = start + 9;

        if ((9 - row) % 2 === 0) {
          for (let n = end; n >= start; n--) values.push(n);
        } else {
          for (let n = start; n <= end; n++) values.push(n);
        }

        rows.push(values);
      }

      boardEl.innerHTML = "";
      rows.flat().forEach((cellNumber) => {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.cell = cellNumber;

        if (snakes[cellNumber]) cell.classList.add("snake-cell");
        if (ladders[cellNumber]) cell.classList.add("ladder-cell");

        const number = document.createElement("span");
        number.className = "cell-number";
        number.textContent = cellNumber;

        cell.appendChild(number);
        boardEl.appendChild(cell);
      });
    }

    function updateTurnDisplay() {
      turnEl.textContent = `Turn: ${players[currentPlayerIndex].name}`;
    }

    function renderTokens() {
      boardEl.querySelectorAll(".token").forEach((token) => token.remove());

      players.forEach((player) => {
        if (player.position <= 0) return;

        const cell = boardEl.querySelector(`[data-cell="${player.position}"]`);
        if (!cell) return;

        const token = document.createElement("div");
        token.className = "token";
        token.style.background = player.color;
        token.title = player.name;
        cell.appendChild(token);
      });
    }

    function movePlayer(player, steps) {
      const oldPosition = player.position;

      if (player.position + steps > 100) {
        return {
          success: false,
          message: `${player.name} rolled ${steps}, but needs an exact move to finish.`
        };
      }

      player.position += steps;

      if (player.position === 100) {
        gameOver = true;
        rollBtn.disabled = true;
        return {
          success: true,
          message: `${player.name} reached 100 and wins the game!`
        };
      }

      if (ladders[player.position]) {
        const next = ladders[player.position];
        player.position = next;
        return {
          success: true,
          message: `${player.name} climbed a ladder from ${oldPosition + steps} to ${next}!`
        };
      }

      if (snakes[player.position]) {
        const next = snakes[player.position];
        player.position = next;
        return {
          success: true,
          message: `${player.name} slid down a snake from ${oldPosition + steps} to ${next}!`
        };
      }

      return {
        success: true,
        message: `${player.name} moved from ${oldPosition || "start"} to ${player.position}.`
      };
    }

    function rollDice() {
      if (gameOver) return;

      const player = players[currentPlayerIndex];
      const roll = Math.floor(Math.random() * 6) + 1;
      diceEl.textContent = roll;

      const result = movePlayer(player, roll);
      renderTokens();

      if (!result.success) {
        messageEl.textContent = result.message;
        currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
        updateTurnDisplay();
        return;
      }

      if (gameOver) {
        messageEl.textContent = result.message;
        return;
      }

      currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
      updateTurnDisplay();

      messageEl.textContent = `${result.message} ${players[currentPlayerIndex].name}'s turn.`;
    }

    function resetGame() {
      gameOver = false;
      players.forEach((player) => {
        player.position = 0;
      });

      currentPlayerIndex = 0;
      diceEl.textContent = "-";
      rollBtn.disabled = false;

      buildBoard();
      renderTokens();
      updateTurnDisplay();
      messageEl.textContent = "Red starts the game.";
    }

    newGameBtn.addEventListener("click", resetGame);
    rollBtn.addEventListener("click", rollDice);

    buildBoard();
    renderTokens();
    updateTurnDisplay();
  </script>
</body>
</html>
